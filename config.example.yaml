# YellowSocks Linux 配置示例
# 本地提供 DNS、DoT、DoH、SOCKS5、HTTP 代理，需要代理的流量经 SPP 转发。

# 远端 SPP 服务器
spp_server: "1.2.3.4:8888"
spp_proto: "tcp"          # tcp, udp, kcp, quic
spp_key: "123456"
# spp_encrypt: ""
# spp_compress: 128

# 多节点故障转移。配置后覆盖上面的单节点。
# nodes:
#   - name: "Node-US"
#     server: "us.example.com:8888"
#     server_proto: "tcp"
#     key: "123456"
#   - name: "Node-EU"
#     server: "eu.example.com:8888"
#     server_proto: "quic"
#     key: "123456"

# 入站 SOCKS5（TCP CONNECT + UDP ASSOCIATE）。
# 用 ":1080" 同时接受 IPv4 和 IPv6，用 "[::1]:1080" 只听 IPv6。
socks5_listen: "127.0.0.1:1080"

# 入站 HTTP/HTTPS 代理（HTTP 方法 + CONNECT）
http_listen: "127.0.0.1:8080"

# 是否允许 IPv6 目标经 SPP 转发，默认 false。
# 关闭时：代理域名的 AAAA 查询返回空，IPv6 字面量目标直接拒绝
# （SOCKS5 回 0x03，HTTP 回 502），客户端会改用 IPv4。
# 仅当 SPP 服务端有 IPv6 出口时才打开。
# ipv6: false

# 可选入站认证，SOCKS5 与 HTTP 共用
# proxy_username: "user"
# proxy_password: "password"

# DNS：UDP、DoH (RFC 8484)、可选 DoT (RFC 7858)
dns_listen: "127.0.0.1:53"
doh_listen: "127.0.0.1:8053"
# dot_listen: ":853"
# tls_cert: "/etc/letsencrypt/live/example.com/fullchain.pem"
# tls_key: "/etc/letsencrypt/live/example.com/privkey.pem"
direct_dns: "114.114.114.114:53"
doh_url: "https://1.1.1.1/dns-query"

# 分流：域名与网段直连，其余走 SPP
# geoip_file: "GeoLite2-Country.mmdb"
# china_domains: "accelerated-domains.china.conf"
# gfw_domains: "gfw.txt"
# direct_domains:
#   - "local"
#   - "internal.corp"
# direct_cidrs:
#   - "192.168.0.0/16"
#   - "10.0.0.0/8"

# 统计 API：对外提供实时与历史数据，供网页看板查看。
# 开启后需要 token 访问；留空时会自动生成并打印在日志里。
# api_listen: "127.0.0.1:9090"   # 只有本机能访问；用 "0.0.0.0:9090" 对外开放
# api_token: "change-me"         # 建议显式设置
# api_origins: ["*"]             # 浏览器跨域白名单；["none"] 关闭 CORS（反代同源时用）
# api_dashboard: true            # 在 http://<api_listen>/ 提供内置看板
# api_pprof: false               # 抓热点时才开：/debug/pprof/ 需要管理 token，会暴露域名与堆栈

# 页面与 API 分机部署时的加固（见 README「把页面和 API 分开部署」）：
# api_readonly_token: ""         # 只读 token：只能 GET，即便泄露也清不掉统计数据
# api_allowed_cidrs:             # 只允许这些"对端"连进来，填反代机器的地址
#   - "10.0.0.1/32"
# api_trusted_proxies:           # 只有这些来源发来的 X-Forwarded-For 才被采信
#   - "10.0.0.1/32"
# api_client_cidrs:              # 可选：再按反代透传的真实访客 IP 过滤（需配合上一项）
#   - "203.0.113.0/24"

# 统计数据的落盘与保留时长。历史按分钟聚合，重启后自动恢复。
# stats_file: "stats.json"       # 默认：开启 API 时用工作目录下的 stats.json
# stats_history_hours: 24        # 保留多少小时（最大 720）

loglevel: "info"
