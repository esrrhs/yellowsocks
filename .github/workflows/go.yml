name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write

jobs:
  check-version:
    name: Check Version
    runs-on: ubuntu-latest
    outputs:
      release_needed: ${{ steps.check.outputs.release_needed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect if VERSION requires a new release
        id: check
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "Current version in repository: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          git fetch --tags
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Git tag v$VERSION already exists. Skipping release."
            echo "release_needed=false" >> $GITHUB_OUTPUT
          else
            echo "Git tag v$VERSION does not exist. New release required!"
            echo "release_needed=true" >> $GITHUB_OUTPUT
          fi

  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true

      - name: Run tests
        run: go test -race -coverprofile=coverage.txt -covermode=atomic -skip 'TestE2E_LargeStream_1GB' ./...

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.txt

      - name: Run 1GiB large stream E2E (no race)
        run: go test -v -count=1 -timeout 5m ./core/proxy -run '^TestE2E_LargeStream_1GB_UploadAndDownload$'

      - name: Build Linux CLI
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          GIT_COMMIT=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          LDFLAGS="-s -w -X github.com/esrrhs/yellowsocks/core/version.Version=${VERSION} -X github.com/esrrhs/yellowsocks/core/version.GitCommit=${GIT_COMMIT} -X \"github.com/esrrhs/yellowsocks/core/version.BuildTime=${BUILD_TIME}\""
          go build -ldflags="$LDFLAGS" -o yellowsocks-cli ./cli
          ./yellowsocks-cli -v

  package:
    name: Package Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true

      - name: Install zip
        run: sudo apt-get install -y zip

      - name: Build Linux packages
        run: |
          chmod +x pack.sh
          ./pack.sh

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: yellowsocks-linux
          path: pack/*.zip

  gui:
    name: GUI (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows_amd64
            shell-dir: windows
          - os: macos-latest
            platform: darwin_arm64
            shell-dir: macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1

      - name: Run shared GUI tests
        working-directory: guiapp
        run: go test -count=1 ./...

      - name: Build GUI
        working-directory: ${{ matrix.shell-dir }}
        shell: bash
        run: wails build -webview2 embed

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Compress-Archive -Path windows/build/bin/yellowsocks-gui.exe, config.example.yaml -DestinationPath yellowsocks-gui_${{ matrix.platform }}.zip

      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          cd ${{ matrix.shell-dir }}/build/bin
          zip -ry ../../../yellowsocks-gui_${{ matrix.platform }}.zip yellowsocks-gui.app

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: yellowsocks-gui-${{ matrix.platform }}
          path: yellowsocks-gui_${{ matrix.platform }}.zip

  release:
    name: Publish GitHub Release
    needs: [check-version, test, package, gui]
    if: github.ref == 'refs/heads/master' && needs.check-version.outputs.release_needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Git Tag
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release YellowSocks v$VERSION"
          git push origin "v$VERSION"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare Release Files
        run: |
          mkdir -p dist
          find release-artifacts -type f -name "*.zip" -exec cp {} dist/ \;
          ls -lh dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.check-version.outputs.version }}"
          name: "YellowSocks v${{ needs.check-version.outputs.version }}"
          files: dist/*
          generate_release_notes: true
