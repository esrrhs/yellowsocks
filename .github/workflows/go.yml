name: CI & Multi-Platform Build

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write

jobs:
  # ========================================================
  # 1. Linux 单元测试与基础包验证
  # ========================================================
  test:
    name: 1. Test & Verify (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Install Linux GUI Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev libgtk-3-dev

      - name: Run Unit Tests
        run: |
          go test -v ./core/config/...

      - name: Build Linux CLI & GUI
        run: |
          go build -v -ldflags="-s -w" -o yellowsocks-cli ./cmd/yellowsocks-cli
          go build -v -ldflags="-s -w" -o yellowsocks-gui ./cmd/yellowsocks-gui

  # ========================================================
  # 2. Windows & OpenWrt 路由器全架构交叉编译打包
  # ========================================================
  cross-compile:
    name: 2. Cross-Compile (Windows & Routers)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Install zip tool
        run: sudo apt-get install -y zip

      - name: Run pack.sh
        run: |
          chmod +x pack.sh
          ./pack.sh

      - name: Upload Windows & Router Packages
        uses: actions/upload-artifact@v4
        with:
          name: yellowsocks-desktop-and-routers
          path: pack/*.zip

  # ========================================================
  # 3. macOS 原生独立 GUI 桌面客户端构建
  # ========================================================
  macos-build:
    name: 3. macOS Native GUI Client
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Build macOS App Bundle
        run: |
          chmod +x build_macos.sh
          ./build_macos.sh
          zip -r YellowSocks_macOS.zip YellowSocks.app

      - name: Upload macOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YellowSocks-macOS-App
          path: YellowSocks_macOS.zip

  # ========================================================
  # 4. Android 手机端构建 (AAR & Mobile Core)
  # ========================================================
  android-build:
    name: 4. Android Client (AAR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Install gomobile tool
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Build Android AAR
        run: |
          chmod +x build_android.sh
          ./build_android.sh

      - name: Upload Android AAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YellowSocks-Android-AAR
          path: android/app/libs/yellowsocks.aar

  # ========================================================
  # 5. iOS & iPadOS 移动客户端构建 (XCFramework)
  # ========================================================
  ios-build:
    name: 5. iOS & iPadOS Client (XCFramework)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Install gomobile tool
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Build iOS YellowSocks.xcframework
        run: |
          chmod +x build_ios.sh
          ./build_ios.sh
          zip -r YellowSocks_iOS_Framework.zip ios/Frameworks/YellowSocks.xcframework

      - name: Verify Xcode Project Syntax
        run: |
          xcodebuild -project ios/YellowSocks.xcodeproj -scheme YellowSocks -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO -dry-run build || true

      - name: Upload iOS XCFramework Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YellowSocks-iOS-Framework
          path: YellowSocks_iOS_Framework.zip

  # ========================================================
  # 6. 聚合所有平台产物发布 GitHub Release (Tag 触发)
  # ========================================================
  release:
    name: 6. Publish All-Platform GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, cross-compile, macos-build, android-build, ios-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare Release Files
        run: |
          mkdir -p dist
          find release-artifacts -type f \( -name "*.zip" -o -name "*.aar" \) -exec cp {} dist/ \;
          ls -lh dist/

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
